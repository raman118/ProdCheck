  <text x="778" y="450" text-anchor="middle" fill="#0a150b" font-family="Arial,sans-serif" font-size="15" font-weight="700">Scan repository →</text>
  <text x="550" y="512" text-anchor="middle" fill="#9ba6b5" font-family="Arial,sans-serif" font-size="13">Public GitHub only · No login · We never run repository code</text>
  <text x="550" y="585" text-anchor="middle" fill="#586270" font-family="Arial,sans-serif" font-size="13">SCREENSHOT PLACEHOLDER</text>
